<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>ROYEL AVAITOR — Crash Game</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lato:wght@300;400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c9a84c;--gl:#f0d060;--gd:#8a6a1f;--cream:#fdf6e3;--green:#27ae60;--red:#e74c3c;}
body{font-family:'Lato',sans-serif;background:#061509;min-height:100vh;overflow-x:hidden;}
.felt-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 50% 50%,#1a5c30 0%,#0d3b1e 45%,#061509 100%);}
.suits-bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.suit{position:absolute;font-size:3rem;opacity:0.04;animation:floatS 15s ease-in-out infinite;user-select:none;}
.suit:nth-child(1){top:10%;left:5%;font-size:4rem;}
.suit:nth-child(2){top:20%;right:8%;animation-delay:3s;font-size:2.5rem;}
.suit:nth-child(3){bottom:15%;left:10%;animation-delay:6s;font-size:3.5rem;}
.suit:nth-child(4){bottom:25%;right:5%;animation-delay:9s;}
.suit:nth-child(5){top:45%;left:2%;animation-delay:2s;}
.suit:nth-child(6){top:55%;right:3%;animation-delay:7s;}
@keyframes floatS{0%,100%{transform:translateY(0) rotate(0deg)}33%{transform:translateY(-20px) rotate(5deg)}66%{transform:translateY(10px) rotate(-3deg)}}
@keyframes sheen{0%,100%{left:-100%}50%{left:0%}}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes numPop{from{transform:scale(1.6);opacity:0.2}to{transform:scale(1);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
@keyframes planeFly{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
@keyframes cglow{from{box-shadow:0 4px 15px rgba(39,174,96,0.4)}to{box-shadow:0 4px 30px rgba(39,174,96,0.9)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes quantum{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:translateY(0)}}

/* main aviator layout */
.main-container {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  min-height: 100vh;
  background: rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 10;
  padding-bottom: 20px;
}
.topbar {
  background: linear-gradient(135deg,#8a6a1f,#c9a84c,#f0d060,#c9a84c,#8a6a1f);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.topbar::before {
  content:'';position:absolute;top:0;left:-100%;width:200%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  animation:sheen 5s ease-in-out infinite;
}
.topbar-logo {
  font-family:'Cinzel',serif;
  font-size:20px;
  font-weight:900;
  color:#0d0500;
  letter-spacing:3px;
}
.topbar-suits {
  font-size:0.9rem;
  color:rgba(12,6,0,0.5);
  letter-spacing:4px;
}
.balance-pill {
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(4px);
  padding:6px 14px;
  border-radius:30px;
  font-family:'Cinzel',serif;
  font-size:18px;
  font-weight:900;
  color:var(--gl);
  border:1px solid rgba(201,168,76,0.5);
}
.balance-pill span {
  font-size:12px;
  margin-right:3px;
}
.av-canvas {
  position:relative;
  min-height:280px;
  background:linear-gradient(180deg,#050010,#0a001a);
  overflow:hidden;
  flex-shrink:0;
  margin-top:6px;
  border-radius:0 0 16px 16px;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
}
.av-grid {
  position:absolute;
  inset:0;
  background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size:40px 30px;
  pointer-events:none;
}
.av-cv {
  position:absolute;
  inset:0;
  z-index:4;
}
.cd-ov {
  position:absolute;
  inset:0;
  z-index:9;
  background:rgba(5,0,18,0.85);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.cd-ring {
  width:100px;
  height:100px;
  border-radius:50%;
  border:3px solid rgba(255,165,0,0.5);
  background:rgba(255,165,0,0.08);
  display:flex;
  align-items:center;
  justify-content:center;
  animation:pulse 1s ease-in-out infinite alternate;
}
.cd-num {
  font-family:'Cinzel',serif;
  font-size:55px;
  font-weight:900;
  color:#ffa500;
  line-height:1;
}
.cd-num.pop{animation:numPop 0.35s cubic-bezier(.16,1,.3,1);}
.cd-txt {
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:4px;
  color:rgba(255,165,0,0.7);
}
.cd-hint {
  font-family:'Cinzel',serif;
  font-size:10px;
  color:rgba(255,255,255,0.4);
  background:rgba(0,0,0,0.5);
  padding:4px 12px;
  border-radius:20px;
}
.av-mult-wrap {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:5;
}
.av-mn {
  font-family:'Cinzel',serif;
  font-size:54px;
  font-weight:900;
  color:#fff;
  text-shadow:0 0 30px rgba(255,100,100,0.9);
  line-height:1;
}
.av-mn.crashed{color:#ff3333;}
.av-mn.cashed{color:#00ff88;}
.av-mn-x{font-size:24px;color:rgba(255,255,255,0.6);}
.av-plbl {
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:3px;
  color:rgba(255,255,255,0.5);
  margin-top:6px;
}
.av-plane-el {
  position:absolute;
  font-size:32px;
  z-index:6;
  filter:drop-shadow(0 0 12px rgba(255,150,100,0.9));
  display:none;
  transition:left 0.03s linear, bottom 0.03s linear;
}
.crash-fl {
  position:absolute;
  inset:0;
  background:rgba(255,0,0,0.25);
  z-index:7;
  display:none;
  align-items:center;
  justify-content:center;
  font-family:'Cinzel',serif;
  font-size:28px;
  font-weight:900;
  color:#ff4444;
  backdrop-filter:blur(2px);
}
.ph-badge {
  position:absolute;
  top:12px;
  left:12px;
  z-index:8;
  font-family:'Cinzel',serif;
  font-size:9px;
  font-weight:700;
  padding:4px 12px;
  border-radius:20px;
  background:rgba(0,0,0,0.6);
}
.ph-badge.bet{background:rgba(255,165,0,0.2);border:1px solid rgba(255,165,0,0.5);color:#ffa500;}
.ph-badge.fly{background:rgba(39,174,96,0.2);border:1px solid rgba(39,174,96,0.5);color:#2ecc71;}
.ph-badge.crash{background:rgba(231,76,60,0.2);border:1px solid rgba(231,76,60,0.5);color:#e74c3c;}
.av-ctrl {
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(8px);
  border-top:1px solid rgba(255,255,255,0.08);
  padding:14px 16px;
  flex-shrink:0;
  margin-top:10px;
  border-radius:20px;
  margin:12px 12px 0 12px;
}
.av-bet-row {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}
.av-bet-lbl {
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:2px;
  color:rgba(255,255,255,0.4);
  white-space:nowrap;
}
.av-inp {
  flex:1;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(201,168,76,0.3);
  border-radius:12px;
  padding:10px 12px;
  color:#fff;
  font-family:'Cinzel',serif;
  font-size:16px;
  font-weight:700;
  text-align:center;
  outline:none;
}
.av-inp:disabled{opacity:0.4;cursor:not-allowed;}
.av-qbs {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.av-qb {
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(201,168,76,0.2);
  border-radius:8px;
  padding:6px 12px;
  color:rgba(255,255,255,0.6);
  font-size:11px;
  font-weight:700;
  font-family:'Cinzel',serif;
  cursor:pointer;
  transition:0.2s;
}
.av-qb:hover:not(:disabled){background:rgba(255,165,0,0.2);border-color:#ffa500;color:#ffa500;}
.av-qb:disabled{opacity:0.3;cursor:not-allowed;}
.av-acts {
  display:flex;
  gap:12px;
}
.btn-bet {
  flex:1;
  padding:14px;
  background:linear-gradient(135deg,#9b1a0e,#e74c3c);
  border:none;
  border-radius:14px;
  font-family:'Cinzel',serif;
  font-size:14px;
  font-weight:900;
  color:#fff;
  cursor:pointer;
  transition:0.2s;
}
.btn-bet:disabled{opacity:0.5;cursor:not-allowed;}
.btn-cash {
  flex:1;
  padding:14px;
  background:linear-gradient(135deg,#0e5c2b,#27ae60);
  border:none;
  border-radius:14px;
  font-family:'Cinzel',serif;
  font-size:14px;
  font-weight:900;
  color:#fff;
  cursor:pointer;
  display:none;
  animation:cglow 0.9s ease-in-out infinite alternate;
}
.av-lb {
  margin:16px 12px 12px;
  background:rgba(0,0,0,0.45);
  border:1px solid rgba(201,168,76,0.2);
  border-radius:20px;
  overflow:hidden;
  backdrop-filter:blur(4px);
}
.av-lb-hdr {
  background:rgba(201,168,76,0.08);
  padding:10px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(201,168,76,0.15);
}
.av-lb-ttl {
  font-family:'Cinzel',serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:3px;
  color:rgba(201,168,76,0.7);
}
.av-lb-live {
  font-size:10px;
  color:#2ecc71;
  display:flex;
  align-items:center;
  gap:5px;
}
.lb-dot {
  width:6px;
  height:6px;
  border-radius:50%;
  background:#2ecc71;
  animation:blink 1.5s infinite;
}
.lb-row {
  display:flex;
  align-items:center;
  padding:8px 14px;
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.lb-rank {
  width:32px;
  font-family:'Cinzel',serif;
  font-size:12px;
  font-weight:700;
  color:rgba(201,168,76,0.5);
}
.lb-rank.g{color:#f0d060;}
.lb-rank.s{color:#c0c0c0;}
.lb-rank.b{color:#cd7f32;}
.lb-name {
  flex:1;
  font-size:12px;
  color:rgba(255,255,255,0.8);
  font-weight:500;
}
.lb-mult {
  font-family:'Cinzel',serif;
  font-size:12px;
  font-weight:700;
  color:#ff8c8c;
  width:70px;
  text-align:right;
}
.lb-bet {
  font-family:'Cinzel',serif;
  font-size:11px;
  font-weight:700;
  color:#ffb347;
  width:75px;
  text-align:right;
}
.lb-row.you {
  background:rgba(201,168,76,0.08);
  border-left:3px solid var(--gl);
}
.toast {
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#0a3d1a,#27ae60);
  color:#fff;
  padding:10px 20px;
  border-radius:40px;
  font-family:'Cinzel',serif;
  font-size:12px;
  z-index:1000;
  transition:0.3s;
  opacity:0;
  pointer-events:none;
  white-space:nowrap;
  border:1px solid rgba(255,255,255,0.2);
}
.toast.show{opacity:1;bottom:100px;}
</style>
</head>
<body>
<div class="felt-bg"></div>
<div class="suits-bg">
  <div class="suit">♠</div><div class="suit">♥</div><div class="suit">♦</div><div class="suit">♣</div>
  <div class="suit">♠</div><div class="suit">♦</div>
</div>

<div class="main-container">
  <div class="topbar">
    <div>
      <div class="topbar-logo">ROYEL AVAITOR</div>
      <div class="topbar-suits">♠ ♥ ♦ ♣</div>
    </div>
    <div class="balance-pill"><span>৳</span><span id="mainBalance">10,000.00</span></div>
  </div>

  <!-- AVIATOR GAME AREA -->
  <div class="av-canvas" id="avCanvas">
    <div class="av-grid"></div>
    <canvas id="avCv" class="av-cv"></canvas>
    <div class="cd-ov" id="avCdOv">
      <div class="cd-ring"><div class="cd-num" id="avCdNum">10</div></div>
      <div class="cd-txt">NEXT ROUND</div>
      <div class="cd-hint">✨ PLACE YOUR BET ✨</div>
    </div>
    <div class="av-mult-wrap" id="avMW" style="display:none">
      <div class="av-mn" id="avMN">1.00<span class="av-mn-x">x</span></div>
      <div class="av-plbl" id="avPL">FLYING...</div>
    </div>
    <div class="av-plane-el" id="avPlane">✈️</div>
    <div class="crash-fl" id="avCrashFl" style="display:none;">💥 CRASHED!</div>
    <div class="ph-badge bet" id="avPhBadge">🟡 BETTING OPEN</div>
  </div>

  <div class="av-ctrl">
    <div class="av-bet-row">
      <span class="av-bet-lbl">BET ৳</span>
      <input type="number" class="av-inp" id="avBetInp" value="200" min="200" step="100"/>
    </div>
    <div class="av-qbs">
      <button class="av-qb" data-amount="200">200</button>
      <button class="av-qb" data-amount="500">500</button>
      <button class="av-qb" data-amount="1000">1K</button>
      <button class="av-qb" data-amount="5000">5K</button>
      <button class="av-qb" data-amount="10000">10K</button>
      <button class="av-qb" data-amount="50000">50K</button>
      <button class="av-qb" data-amount="100000">1L</button>
      <button class="av-qb" data-amount="200000">2L</button>
    </div>
    <div class="av-acts">
      <button class="btn-bet" id="avBetBtn">🎲 BET NOW</button>
      <button class="btn-cash" id="avCashBtn">💰 STOP</button>
    </div>
  </div>

  <div class="av-lb">
    <div class="av-lb-hdr"><div class="av-lb-ttl">🏆 LIVE LEADERBOARD</div><div class="av-lb-live"><div class="lb-dot"></div>LIVE</div></div>
    <div id="avLbBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ========== STANDALONE AVIATOR GAME (NO AUTH, NO BACKEND) ==========
  let balance = 10000.00;
  let avPhase = 'idle';        // idle, countdown, flying, crashed
  let avBetPlaced = false;
  let avBetAmt = 0;
  let avMult = 1.00;
  let avCrashAt = 3.00;
  let avRaf = null;
  let avRoundStart = 0;
  let avCdTimer = null;
  let avPoints = [];           // for curve
  let avCtx = null;

  // random player names (mock)
  const AV_NAMES = ['Rahim_X','Karim99','Sumon★','NightKing','BetKing88','GoldRush','Lucky7','SpeedBet','TigerBet','AcePlayer','RoyalFly','DiamondX','StormBet','PhoenixUp','NightHawk','PlatinumK','IronFist','CobraKing','MaxBet99','UltraFly'];
  let usedNames = new Set();

  // helpers
  function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = isError ? 'linear-gradient(135deg,#5c0a0a,#c0392b)' : 'linear-gradient(135deg,#0a3d1a,#27ae60)';
    toast.classList.add('show');
    clearTimeout(window._toastTimeout);
    window._toastTimeout = setTimeout(() => toast.classList.remove('show'), 2800);
  }

  function updateBalanceUI() {
    document.getElementById('mainBalance').innerText = balance.toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  // absolute minimum crash = 3.00x
  function generateCrashPoint() {
    let raw = 3.0;
    const r = Math.random();
    if (r < 0.25) raw = 8 + Math.random() * 12;
    else if (r < 0.5) raw = 20 + Math.random() * 20;
    else if (r < 0.7) raw = 40 + Math.random() * 30;
    else if (r < 0.9) raw = 70 + Math.random() * 20;
    else raw = 90 + Math.random() * 10;
    return Math.max(3.0, raw);
  }

  function initCanvas() {
    const cv = document.getElementById('avCv');
    const container = document.getElementById('avCanvas');
    if (!cv || !container) return;
    cv.width = container.clientWidth || 440;
    cv.height = container.clientHeight || 280;
    avCtx = cv.getContext('2d');
    avCtx.clearRect(0, 0, cv.width, cv.height);
  }

  function drawCurve() {
    if (!avCtx || avPoints.length < 2) return;
    const cv = document.getElementById('avCv');
    const w = cv.width, h = cv.height;
    avCtx.clearRect(0, 0, w, h);
    const gr = avCtx.createLinearGradient(0, h, w * 0.8, 0);
    gr.addColorStop(0, 'rgba(255,80,80,0.2)');
    gr.addColorStop(0.6, 'rgba(255,120,80,0.8)');
    gr.addColorStop(1, 'rgba(255,220,80,1)');
    avCtx.beginPath();
    avCtx.moveTo(avPoints[0].x, avPoints[0].y);
    for (let i = 1; i < avPoints.length; i++) avCtx.lineTo(avPoints[i].x, avPoints[i].y);
    avCtx.strokeStyle = gr;
    avCtx.lineWidth = 3;
    avCtx.shadowBlur = 10;
    avCtx.shadowColor = 'rgba(255,100,80,0.6)';
    avCtx.stroke();
    avCtx.lineTo(avPoints[avPoints.length-1].x, h);
    avCtx.lineTo(avPoints[0].x, h);
    avCtx.closePath();
    avCtx.fillStyle = 'rgba(255,100,100,0.05)';
    avCtx.fill();
    avCtx.shadowBlur = 0;
  }

  function setBadge(phase) {
    const badge = document.getElementById('avPhBadge');
    badge.className = 'ph-badge ' + phase;
    if(phase === 'bet') badge.textContent = '🟡 BETTING OPEN';
    else if(phase === 'fly') badge.textContent = '🟢 FLYING';
    else badge.textContent = '🔴 CRASHED';
  }

  function updateUIState() {
    const betBtn = document.getElementById('avBetBtn');
    const cashBtn = document.getElementById('avCashBtn');
    const betInput = document.getElementById('avBetInp');
    const qbs = document.querySelectorAll('.av-qb');
    if (avPhase === 'flying') {
      if (avBetPlaced) {
        betBtn.style.display = 'none';
        cashBtn.style.display = 'flex';
      } else {
        betBtn.style.display = 'flex';
        betBtn.disabled = true;
        betBtn.textContent = '🔒 FLYING...';
        cashBtn.style.display = 'none';
      }
      betInput.disabled = true;
      qbs.forEach(b => b.disabled = true);
    } else if (avPhase === 'countdown') {
      cashBtn.style.display = 'none';
      betBtn.style.display = 'flex';
      if (avBetPlaced) {
        betBtn.disabled = true;
        betBtn.textContent = '✅ BET PLACED';
      } else {
        betBtn.disabled = false;
        betBtn.textContent = '🎲 BET NOW';
      }
      betInput.disabled = avBetPlaced;
      qbs.forEach(b => b.disabled = avBetPlaced);
    } else {
      betBtn.style.display = 'flex';
      betBtn.disabled = true;
      betBtn.textContent = '⏳ NEXT ROUND...';
      cashBtn.style.display = 'none';
      betInput.disabled = true;
      qbs.forEach(b => b.disabled = true);
    }
  }

  function startCountdown() {
    if (avCdTimer) clearInterval(avCdTimer);
    avPhase = 'countdown';
    avMult = 1.00;
    avCrashAt = generateCrashPoint();
    avBetPlaced = false;
    avPoints = [];
    document.getElementById('avCdOv').style.display = 'flex';
    document.getElementById('avMW').style.display = 'none';
    document.getElementById('avPlane').style.display = 'none';
    document.getElementById('avCrashFl').style.display = 'none';
    const mnEl = document.getElementById('avMN');
    mnEl.className = 'av-mn';
    setBadge('bet');
    updateUIState();
    initCanvas();
    let count = 10;
    const cdNum = document.getElementById('avCdNum');
    cdNum.innerText = count;
    avCdTimer = setInterval(() => {
      count--;
      if (count > 0) {
        cdNum.innerText = count;
        cdNum.classList.remove('pop');
        void cdNum.offsetWidth;
        cdNum.classList.add('pop');
      } else {
        clearInterval(avCdTimer);
        avCdTimer = null;
        startFlight();
      }
    }, 1000);
  }

  function startFlight() {
    avPhase = 'flying';
    avRoundStart = performance.now();
    document.getElementById('avCdOv').style.display = 'none';
    document.getElementById('avMW').style.display = 'block';
    document.getElementById('avMN').innerHTML = '1.00<span class="av-mn-x">x</span>';
    document.getElementById('avPL').textContent = 'FLYING...';
    document.getElementById('avPlane').style.display = 'block';
    setBadge('fly');
    updateUIState();
    requestAnimationFrame(tick);
  }

  function tick(now) {
    if (avPhase !== 'flying') return;
    const elapsed = (performance.now() - avRoundStart) / 1000;
    avMult = parseFloat((1 + 0.4 * elapsed + 0.0012 * elapsed * elapsed).toFixed(2));
    document.getElementById('avMN').innerHTML = avMult.toFixed(2) + '<span class="av-mn-x">x</span>';
    if (avBetPlaced) {
      const potential = Math.floor(avBetAmt * avMult);
      document.getElementById('avCashBtn').innerHTML = `💰 STOP — ৳${potential.toLocaleString('en')}`;
    }
    const cv = document.getElementById('avCv');
    const w = cv.width, h = cv.height;
    const progress = Math.min(elapsed / 48, 0.98);
    const leftPct = 4 + progress * 86;
    const bottomPct = 7 + progress * 78 + (progress*progress)*5;
    const plane = document.getElementById('avPlane');
    plane.style.left = leftPct + '%';
    plane.style.bottom = bottomPct + '%';
    const xPx = (leftPct / 100) * w;
    const yPx = h - (bottomPct / 100) * h;
    avPoints.push({ x: xPx, y: yPx });
    drawCurve();
    if (avMult >= avCrashAt) {
      crashRound();
      return;
    }
    avRaf = requestAnimationFrame(tick);
  }

  function crashRound() {
    if (avPhase !== 'flying') return;
    avPhase = 'crashed';
    cancelAnimationFrame(avRaf);
    document.getElementById('avPlane').style.display = 'none';
    const mnEl = document.getElementById('avMN');
    mnEl.className = 'av-mn crashed';
    document.getElementById('avPL').textContent = '💥 CRASHED!';
    document.getElementById('avCrashFl').style.display = 'flex';
    setBadge('crash');
    if (avBetPlaced) {
      showToast(`💥 CRASH at ${avMult.toFixed(2)}x! Lost ৳${avBetAmt.toLocaleString('en')}`, true);
      avBetPlaced = false;
      updateUIState();
    }
    setTimeout(() => {
      document.getElementById('avCrashFl').style.display = 'none';
      startCountdown();
    }, 2600);
  }

  function cashOut() {
    if (!avBetPlaced || avPhase !== 'flying') return;
    const winMult = avMult;
    const winAmount = Math.floor(avBetAmt * winMult);
    const profit = winAmount - avBetAmt;
    balance += winAmount;
    updateBalanceUI();
    showToast(`🎉 CASHED at ${winMult.toFixed(2)}x! +৳${profit.toLocaleString('en')}`, false);
    avBetPlaced = false;
    document.getElementById('avMN').className = 'av-mn cashed';
    document.getElementById('avPL').textContent = `✅ CASHED ${winMult.toFixed(2)}x`;
    updateUIState();
    // add current player to leaderboard flash effect
    buildLeaderboard(true);
    // but game continues until crash
  }

  function placeBet() {
    if (avPhase !== 'countdown') {
      showToast('⏳ Wait for countdown to place bet!', true);
      return;
    }
    if (avBetPlaced) {
      showToast('⚠️ Bet already placed this round!', true);
      return;
    }
    let amount = parseInt(document.getElementById('avBetInp').value);
    if (isNaN(amount) || amount < 200) amount = 200;
    if (amount > 200000) amount = 200000;
    document.getElementById('avBetInp').value = amount;
    if (amount > balance) {
      showToast('❌ Insufficient balance!', true);
      return;
    }
    balance -= amount;
    updateBalanceUI();
    avBetAmt = amount;
    avBetPlaced = true;
    updateUIState();
    showToast(`✅ Bet placed: ৳${amount.toLocaleString('en')}`, false);
    buildLeaderboard(true);
  }

  function setQuickAmount(amt) {
    if (avPhase === 'countdown' && !avBetPlaced) {
      document.getElementById('avBetInp').value = amt;
    } else {
      showToast('Can only change bet before placing (countdown)', true);
    }
  }

  // mock leaderboard with random + current player
  function buildLeaderboard(includePlayer = false) {
    if (usedNames.size > AV_NAMES.length - 3) usedNames.clear();
    const available = AV_NAMES.filter(n => !usedNames.has(n));
    const entries = [];
    const usedSet = new Set();
    while (entries.length < 12 && available.length > entries.length) {
      const idx = Math.floor(Math.random() * available.length);
      const name = available[idx];
      if (!usedSet.has(name)) {
        usedSet.add(name);
        usedNames.add(name);
        const mult = (Math.random() * 30 + 2).toFixed(2);
        const bet = Math.floor(200 + Math.random() * 80000);
        entries.push({ name, mult: parseFloat(mult), bet, isUser: false });
      }
    }
    if (includePlayer && avBetPlaced && avPhase !== 'idle') {
      const currentMult = avPhase === 'flying' ? avMult : 1.00;
      entries.unshift({ name: '⭐ YOU', mult: currentMult, bet: avBetAmt, isUser: true });
    }
    entries.sort((a,b) => b.mult - a.mult);
    const container = document.getElementById('avLbBody');
    if (!container) return;
    container.innerHTML = entries.map((e, i) => {
      let rankClass = '', rankLabel = `${i+1}`;
      if (i===0) { rankClass='g'; rankLabel='🥇'; }
      else if (i===1) { rankClass='s'; rankLabel='🥈'; }
      else if (i===2) { rankClass='b'; rankLabel='🥉'; }
      return `<div class="lb-row ${e.isUser ? 'you' : ''}">
        <div class="lb-rank ${rankClass}">${rankLabel}</div>
        <div class="lb-name">${e.name}</div>
        <div class="lb-mult">${e.mult.toFixed(2)}x</div>
        <div class="lb-bet">৳${e.bet.toLocaleString('en')}</div>
      </div>`;
    }).join('');
  }

  // event binding & resize
  window.addEventListener('resize', () => { initCanvas(); if(avPoints.length) drawCurve(); });
  document.querySelectorAll('.av-qb').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const amt = parseInt(btn.getAttribute('data-amount'));
      if (!isNaN(amt)) setQuickAmount(amt);
    });
  });
  document.getElementById('avBetBtn').addEventListener('click', placeBet);
  document.getElementById('avCashBtn').addEventListener('click', cashOut);
  
  // initial round
  function initGame() {
    updateBalanceUI();
    initCanvas();
    startCountdown();
    setInterval(() => { if (avPhase !== 'countdown' && avPhase !== 'flying') return; buildLeaderboard(avBetPlaced); }, 2800);
    buildLeaderboard(false);
  }
  initGame();
</script>
</body>
</html>
